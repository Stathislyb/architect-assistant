name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -c requirements.lock -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m pytest -q
      - run: python -m architect_assistant examples/document-generation.json --output .artifacts/ci-demo --demo-omit-rule DOC_CONFIGURATION
      - run: python -m architect_assistant guidance/projects/document-generation.json --output .artifacts/catalog-demo --demo-omit-rule DOC_CONFIGURATION --max-operations 200
